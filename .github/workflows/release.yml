# Release: build the 6 platform archives the Zed extension's
# download fallback expects (see extension/src/lib.rs).
#
# Trigger: push a v* tag (e.g. v0.1.0). Assets are named
# canc-{target}.tar.gz|.zip to match the extension resolver.

name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, ext: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl, ext: tar.gz }
          - { os: macos-14, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: macos-14, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, ext: zip }
          - { os: windows-2022, target: aarch64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin canc
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="canc-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release/canc"
          [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ] && bin="$bin.exe" || true
          [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ] && bin="$bin.exe" || true
          cp "$bin" "dist/$name/"
          if [ "${{ matrix.ext }}" = "tar.gz" ]; then
            tar -czf "$name.tar.gz" -C dist "$name"
          else
            powershell -c "Compress-Archive -Path dist/$name -DestinationPath $name.zip"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: canc-${{ matrix.target }}.${{ matrix.ext }}
