# Release: build the 6 platform archives the Zed extension's
# download fallback expects (see extension/src/lib.rs).
#
# Trigger: push a v* tag (e.g. v0.1.0). Assets are named
# canc-{target}.tar.gz|.zip to match the extension resolver.

name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux musl — cross-compiled with cargo-zigbuild on ubuntu-amd64,
          # both arches on one runner (no ARM runner needed).
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, ext: tar.gz, zig: true }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-musl, ext: tar.gz, zig: true }
          # Apple silicon and Intel macOS — native runners.
          - { os: macos-14, target: aarch64-apple-darwin, ext: tar.gz, zig: false }
          - { os: macos-13, target: x86_64-apple-darwin, ext: tar.gz, zig: false }
          # Windows — cargo build through MSVC linker; keep both arches.
          - { os: windows-2022, target: x86_64-pc-windows-msvc, ext: zip, zig: false }
          - { os: windows-2022, target: aarch64-pc-windows-msvc, ext: zip, zig: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # zigbuild supplies the musl cc linker (zig cc) so both Linux
      # targets build on plain ubuntu-amd64 without musl-tools.
      - name: Install cargo-zigbuild (Linux cross-only)
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }} --bin canc

      - name: Build (cargo)
        if: ${{ ! matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} --bin canc

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="canc-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release/canc"
          case "${{ matrix.target }}" in
            *-windows-msvc) bin="$bin.exe" ;;
          esac
          cp "$bin" "dist/$name/"
          if [ "${{ matrix.ext }}" = "tar.gz" ]; then
            tar -czf "$name.tar.gz" -C dist "$name"
          else
            # need a zip on Windows runners (powershell's Compress-Archive
            # works but archives include the parent dir — we already gave
            # it the inner dir path, so it behaves like `zip -r` here).
            powershell -NoProfile -Command "Compress-Archive -Path dist/$name -DestinationPath $name.zip"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: canc-${{ matrix.target }}.${{ matrix.ext }}
