[workspace]

[package]
name = "canc-zed"
version = "0.1.0"
edition = "2021"
description = "Zed extension for Anchors (canc): locates the LSP server binary and provides the comment-language grammar."
license = "MIT"
repository = "https://github.com/maikel-479/Anchors"
homepage = "https://github.com/maikel-479/Anchors"
keywords = ["zed", "lsp", "comment", "annotations"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zed_extension_api = "0.7.0"
