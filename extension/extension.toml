id = "canc"
name = "Anchors"
version = "0.1.0"
schema_version = 1
authors = ["maikel"]
description = "Comment tags and inline emphasis, styled by you."
repository = "https://github.com/example/canc"

# Permit the git-release download fallback used by the language-server
# resolver. Release assets redirect to these hosts.
[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["*", "releases", "download", "**"]

[[capabilities]]
kind = "download_file"
host = "objects.githubusercontent.com"
path = ["**"]

[grammars.comment]
repository = "https://github.com/maikel-479/Anchors"
rev = "main"
path = "grammars/comment"

[language_servers.canc]
languages = ["C", "C++", "Rust", "Python", "Go", "JavaScript", "TypeScript", "TSX", "HTML", "CSS", "JSON"]

[language_servers.canc.language_ids]
"C" = "c"
"C++" = "cpp"
"Rust" = "rust"
"Python" = "python"
"Go" = "go"
"JavaScript" = "javascript"
"TypeScript" = "typescript"
"TSX" = "typescriptreact"
"HTML" = "html"
"CSS" = "css"
"JSON" = "json"
