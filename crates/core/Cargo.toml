[package]
name = "canc-core"
version = "0.1.0"
edition = "2021"
description = "Core scanner for comment-tag annotations (NOTE/TODO/…), shared by the canc LSP server and CLI."
license = "MIT"
repository = "https://github.com/maikel-479/Anchors"
homepage = "https://github.com/maikel-479/Anchors"
keywords = ["lsp", "zed", "comment", "annotations", "tree-sitter"]
categories = ["development-tools", "text-processing"]

[lib]
name = "canc_core"
path = "src/lib.rs"

[dependencies]
tree-sitter = "0.24"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ignore = "0.4"
glob = "0.3"
streaming-iterator = "0.1"
