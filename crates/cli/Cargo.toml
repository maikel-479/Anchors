[package]
name = "comment-annotations-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "comment-annotations"
path = "src/main.rs"

[dependencies]
comment-annotations-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-server = "0.7"
lsp-types = "0.94"
ignore = "0.4"
globset = "0.4"
toml = "0.8"
